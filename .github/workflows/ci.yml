name: Offline tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.9.10
      - run: ruff check --select E9,F63,F7,F82 --exclude generated_solutions,runs multiagent_llm_experiment
      - run: python -m compileall -q -l multiagent_llm_experiment
      - run: python -m unittest -v test_protocol test_recording test_sandbox_security
        working-directory: multiagent_llm_experiment
      - run: docker pull python:3.12.8-alpine3.20@sha256:3b1df87fc50e7d47762aeb48673736079aa22e7c98c8851f5453dd49fc03ad1b
      - run: python -m unittest -v test_sandbox_integration test_task_quality
        working-directory: multiagent_llm_experiment
        env:
          RUN_DOCKER_TESTS: '1'
