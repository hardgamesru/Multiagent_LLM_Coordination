name: Research publication checks
on:
  push:
    branches: [main, research-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest benchmark_v3.test_runner benchmark_v3.test_validation tests.test_publication -v
      - run: python tools/verify_publication.py
      - run: python tools/reproduce.py
      - run: python tools/verify_publication.py
